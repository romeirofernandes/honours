<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlycoStrat</title>
    <meta
      name="description"
      content="A two-minute diabetes risk check-up built on 253,680 CDC health surveys. See your estimate, what drives it, and what could lower it."
    />
    <meta name="theme-color" content="#F7F5EF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so the page never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('glycostrat-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#090909' : '#F7F5EF');
        } catch (error) {
          /* localStorage can be unavailable; light mode is the safe default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
